apis:
- aid: tempus:tempus-ehr-integration
  name: Tempus EHR Integration (Tempus Edge)
  description: >-
    Tempus Edge is a secure gateway that establishes bidirectional interfaces with
    provider EHRs using HL7, FHIR, API, and PACS connectivity so genomic test orders
    and results flow directly inside the clinical workflow of systems such as Epic,
    Oracle Health / Cerner, and OncoEMR. Access is provider/partner onboarded rather
    than a public self-serve API; no downloadable OpenAPI or public FHIR
    CapabilityStatement is published as of this review.
  humanURL: https://www.tempus.com/solutions/ehr-integration/
  tags:
  - EHR
  - FHIR
  - HL7
  - Interoperability
  properties:
  - type: Documentation
    url: https://www.tempus.com/solutions/ehr-integration/
  - type: Documentation
    url: https://www.tempus.com/oncology/ehr-integration/
- aid: tempus:tempus-hub
  name: Tempus Hub
  description: >-
    Tempus Hub is a secure online portal for providers to order genomic and molecular
    tests, track order status, and view comprehensive patient results, available on
    desktop and mobile. It is an authenticated provider application; no public API
    reference is documented.
  humanURL: https://www.tempus.com/solutions/hub/
  tags:
  - Genomics
  - Oncology
  - Portal
  properties:
  - type: Documentation
    url: https://www.tempus.com/solutions/hub/
  - type: Documentation
    url: https://www.tempus.com/order/
- aid: tempus:tempus-lens
  name: Tempus Lens Platform
  description: >-
    Tempus Lens is an agentic-AI platform for oncology drug development that combines
    a large de-identified multimodal real-world dataset with Tempus oncology
    foundation models, AI agents, and scientific workflows. It is commercially
    available as a login-gated SaaS application at lens.tempus.ai; no public developer
    API is documented.
  humanURL: https://lens.tempus.ai
  tags:
  - Clinical AI
  - Real-World Data
  - Life Sciences
  properties:
  - type: Documentation
    url: https://www.tempus.com/life-sciences/real-world-data/
