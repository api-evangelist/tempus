name: Tempus
kind: company
description: >-
  Tempus AI, Inc. (formerly Tempus Labs) is an AI-enabled precision medicine and
  genomic diagnostics company founded in 2015 by Eric Lefkofsky and headquartered in
  Chicago, Illinois (NASDAQ: TEM). Tempus has assembled one of the world's largest
  libraries of clinical and molecular data and runs a next-generation-sequencing lab
  offering oncology assays such as Tempus xT (solid-tumor DNA panel), xF (cell-free
  DNA liquid biopsy), xG (germline), and whole-transcriptome RNA, expanding from
  oncology into cardiology, neuropsychiatry, radiology, and infectious disease. For
  its United States home market its technical surface is delivered as partner and
  provider integrations rather than a public self-serve developer program: Tempus Hub
  (a provider portal to order tests and view genomic results), EHR integration via
  Tempus Edge (bidirectional HL7, FHIR, API, and PACS interfaces into Epic, Oracle
  Health / Cerner, OncoEMR, and other EHRs), the Tempus Lens agentic-AI platform for
  oncology drug development, Tempus One clinical assistant, and de-identified
  multimodal real-world-data collaborations for life sciences. As of this review no
  public developer portal, downloadable OpenAPI, or anonymously reachable FHIR
  CapabilityStatement was found; integration is gated behind partner and provider
  onboarding.
